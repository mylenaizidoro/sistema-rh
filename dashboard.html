<script>
    // --- SUA LÓGICA ORIGINAL ---
    Chart.register(ChartDataLabels);
    let dadosGlobais = [];
    
    // [Aqui você mantém todas as suas funções: switchTab, calcularSimulacao, salvarETrabalharListas, etc.]

    // --- NOVA FUNÇÃO PARA O MODELO MOD x MOI (image_4a875c.png) ---
    function renderizarGraficoModMoi() {
        const container = document.getElementById('container-graficos');
        let estrutura = {
            MOI: { "1º TURNO": 0, "2º TURNO": 0, "3º TURNO": 0 },
            MOD: { "1º TURNO": 0, "2º TURNO": 0, "3º TURNO": 0 }
        };

        dadosGlobais.forEach(ln => {
            const texto = (ln.Processo || ln.Indicador || "").toUpperCase();
            const valor = parseFloat(ln.Qtd || ln.Quantidade || 0) || 0;
            if (texto.includes("MOD") || texto.includes("MOI")) {
                let tipo = texto.includes("MOD") ? "MOD" : "MOI";
                let turno = texto.includes("1º") ? "1º TURNO" : (texto.includes("2º") ? "2º TURNO" : (texto.includes("3º") ? "3º TURNO" : null));
                if (turno && estrutura[tipo]) {
                    estrutura[tipo][turno] += valor;
                }
            }
        });

        const idUnique = 'chart-mod-moi';
        container.innerHTML += `
            <div class="card">
                <h2>Distribuição de Mão de Obra (MOD x MOI)</h2>
                <div class="chart-container">
                    <canvas id="${idUnique}"></canvas>
                </div>
            </div>`;

        setTimeout(() => {
            new Chart(document.getElementById(idUnique), {
                type: 'bar',
                data: {
                    labels: ['MOI', 'MOD'],
                    datasets: [
                        { label: '3º Turno', data: [estrutura.MOI["3º TURNO"], estrutura.MOD["3º TURNO"]], backgroundColor: '#ed7d31' },
                        { label: '1º Turno', data: [estrutura.MOI["1º TURNO"], estrutura.MOD["1º TURNO"]], backgroundColor: '#4472c4' },
                        { label: '2º Turno', data: [estrutura.MOI["2º TURNO"], estrutura.MOD["2º TURNO"]], backgroundColor: '#000000' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { x: { stacked: true }, y: { stacked: true } },
                    plugins: {
                        legend: { position: 'bottom' },
                        datalabels: { color: '#ffffff', anchor: 'center', align: 'center', font: { weight: 'bold' } }
                    }
                }
            });
        }, 200);
    }

    // --- ATUALIZE SUA FUNÇÃO DE RENDERIZAÇÃO ---

        renderizarGraficoModMoi();
