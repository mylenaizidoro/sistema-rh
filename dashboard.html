<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Coplac</title>
    </head>
<body>
    <div id="container-graficos"></div>

<script>
    // ... [Mantenha todas as suas funções anteriores: calcularSimulacao, normalizar, etc] ...

    // --- FUNÇÃO DE SEPARAÇÃO PARA DESLIGAMENTO ---
    function renderizarGraficoDesligamentoSeparado(tipo, titulo) {
        const labelsExibicao = anoSelecionado === 'TODOS' ? labelsTodos : labelsTodos.filter(l => l.includes(anoSelecionado));
        
        // Filtro exato: Processo é "DESLIGAMENTO" E contém a palavra do tipo (MOD ou MOI)
        const dadosFiltrados = dadosGlobais.filter(ln => {
            const proc = normalizar(ln.Processo || ln.PROCESSO || "");
            const ind = normalizar(ln.Indicador || ln.INDICADOR || "");
            const matchAno = anoSelecionado === 'TODOS' || (ln.mes || ln.MES || "").includes(anoSelecionado);
            return proc === "DESLIGAMENTO" && (proc.includes(tipo) || ind.includes(tipo)) && matchAno;
        });

        if (dadosFiltrados.length === 0) return;

        const dT1 = dadosFiltrados.filter(ln => normalizar(ln.Indicador || ln.INDICADOR || "").includes("1º TURNO"));
        const dT2 = dadosFiltrados.filter(ln => normalizar(ln.Indicador || ln.INDICADOR || "").includes("2º TURNO"));
        const dT3 = dadosFiltrados.filter(ln => normalizar(ln.Indicador || ln.INDICADOR || "").includes("3º TURNO"));

        const idUnique = 'chart-' + tipo + Math.random().toString(36).substr(2, 5);
        document.getElementById('container-graficos').innerHTML += `
            <div class="card">
                <h2>${titulo}</h2>
                <div class="chart-container" style="height:300px;"><canvas id="${idUnique}"></canvas></div>
            </div>`;

        setTimeout(() => {
            new Chart(document.getElementById(idUnique), {
                type: 'bar',
                data: {
                    labels: labelsExibicao,
                    datasets: [
                        { label: '3º Turno', data: labelsExibicao.map(m => limparNumero(extrairValor(dT3.find(l => (l.mes||l.MES) === m) || {}))), backgroundColor: '#f59e0b', stack: 's1' },
                        { label: '2º Turno', data: labelsExibicao.map(m => limparNumero(extrairValor(dT2.find(l => (l.mes||l.MES) === m) || {}))), backgroundColor: '#000000', stack: 's1' },
                        { label: '1º Turno', data: labelsExibicao.map(m => limparNumero(extrairValor(dT1.find(l => (l.mes||l.MES) === m) || {}))), backgroundColor: '#0284c7', stack: 's1' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }, 150);
    }

    // --- DASHBOARD ATUALIZADO ---
    function renderizarDashboard() {
        document.getElementById('container-graficos').innerHTML = "";
        calcularResumo();
        
        // --- AQUI ESTÁ O SEGREDO: CHAMAMOS SEPARADO ---
        renderizarGraficoDesligamentoSeparado("MOD", "DESLIGAMENTOS - MOD");
        renderizarGraficoDesligamentoSeparado("MOI", "DESLIGAMENTOS - MOI");

        // --- DEMAIS GRÁFICOS ---
        criarGraficoPerformance({ chave: "ABSENTEISMO", titulo: "ABSENTEÍSMO PA - 03", tipo: "MENOR_MELHOR", nota: "Horas Ausentes / Horas Programadas." });
        criarGraficoPerformance({ chave: "> 180", titulo: "TURNOVER PA > 180 DIAS", tipo: "MENOR_MELHOR", nota: "turnover PA desligados > 180 dias/ ativos" });
        criarGraficoPerformance({ chave: "< 180", titulo: "TURNOVER PA < 180 DIAS", tipo: "MENOR_MELHOR", nota: "turnover PA desligados < 180 dias/ ativos" });
        criarGraficoPerformance({ chave: "UNIVERSAL", titulo: "TURNOVER CÁLCULO UNIVERSAL", tipo: "MENOR_MELHOR", nota: "(Adm+Desl)/2 / Total Ativos." });

        const itensConsolidados = [
            { t: "PEDIDO DE DELIGAMENTO EM 15 DIAS", h: "TURNOVER - PEDIDO DE DESLIGAMENTO EM 15 DIAS" },
            { t: "TURNOVER - PEDIDOS DE DESLIGAMENTO MES", h: "TURNOVER - PEDIDOS DE DESLIGAMENTO MÊS" },
            { t: "SOLICITACAO DE DESLIGAMENTO ATE 15", h: "TURNOVER - SOLICITAÇÃO ATÉ 15 DIAS" },
            { t: "SOLICITACAO DE DESLIGAMENTO 16 A 30", h: "TURNOVER - SOLICITAÇÃO 16 A 30 DIAS" },
            { t: "SOLICITACAO DE DESLIGAMENTO 31 A 90", h: "TURNOVER - SOLICITAÇÃO 31 A 90 DIAS" },
            { t: "SOLICITACAO DE DESLIGAMENTO ACIMA DE 90", h: "TURNOVER - SOLICITAÇÃO ACIMA DE 90 DIAS" },
            { t: "INICIATIVA DE DESLIGAMENTO DA EMPRESA dentro de 15 dias", h: "TURNOVER - INICIATIVA EMPRESA ATÉ 15 DIAS" },
            { t: "INICIATIVA DE DESLIGAMENTO DA EMPRESA dentro de 30 dias", h: "TURNOVER - INICIATIVA EMPRESA ATÉ 30 DIAS" },
            { t: "INICIATIVA DE DESLIGAMENTO DA EMPRESA de 31 a 90 dias", h: "TURNOVER - INICIATIVA EMPRESA 31 A 90 DIAS" },
            { t: "INICIATIVA DE DESLIGAMENTO DA EMPRESA acima de 90 dias", h: "TURNOVER - INICIATIVA EMPRESA ACIMA DE 90 DIAS" },
            { t: "INICIATIVA DE DESLIGAMENTO DA EMPRESA geral mes", h: "TURNOVER - INICIATIVA EMPRESA GERAL NO MÊS" }
        ];
        itensConsolidados.forEach(i => criarGraficoConsolidado(i.h, i.t));

        criarGraficoPerformance({ chave: "HORAS DE TREINAMENTO", titulo: "HORAS DE TREINAMENTO", tipo: "MAIOR_MELHOR", nota: "Total de horas acumuladas." });
        criarGraficoPerformance({ chave: "APROVADOS EM TREINAMENTO", titulo: "APROVADOS EM TREINAMENTO", tipo: "MAIOR_MELHOR", nota: "% de aproveitamento." });
        criarGraficoPerformance({ chave: "RETENÇÃO", titulo: "RETENÇÃO PLANO DE VALORIZAÇÃO", tipo: "MAIOR_MELHOR", nota: "Quantidade total de promoções." });
    }

    // ... [MANTENHA O PAPA.PARSE FINAL] ...
</script>
</body>
</html>
