<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
    <div id="container-graficos"></div>

    <script>
        // --- VARIÁVEIS E FUNÇÕES DE APOIO ---
        let dadosGlobais = [];
        let anoSelecionado = 'TODOS';
        let turnoSelecionado = 'TODOS';
        const labelsTodos = Array.from({length: 24}, (_, i) => {
            const m = (i % 12) + 1;
            const a = i < 12 ? '2025' : '2026';
            return `${m.toString().padStart(2,'0')}/${a}`;
        });

        function limparNumero(v) { if (!v) return 0; return parseFloat(v.toString().replace(/\s/g, '').replace(',', '.').replace('%', '')) || 0; }
        function normalizar(txt) { return txt ? txt.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : ""; }
        function extrairValor(ln) { return ln['Valor Real'] || ln['Qtd'] || ln['Quantidade'] || ln['VALOR REAL'] || ln['QTD'] || 0; }

        // --- FUNÇÕES DE GRÁFICOS ---
        function renderizarGraficoDesligamentoSeparado(tipo, titulo) {
            const labelsExibicao = anoSelecionado === 'TODOS' ? labelsTodos : labelsTodos.filter(l => l.includes(anoSelecionado));
            const dadosFiltrados = dadosGlobais.filter(ln => {
                const proc = normalizar(ln.Processo || ln.PROCESSO || "");
                const ind = normalizar(ln.Indicador || ln.INDICADOR || "");
                return proc === "DESLIGAMENTO" && (proc.includes(tipo) || ind.includes(tipo));
            });

            const idUnique = 'chart-' + tipo + Math.random().toString(36).substr(2, 5);
            document.getElementById('container-graficos').innerHTML += `<div class="card"><h2>${titulo}</h2><div style="height:300px;"><canvas id="${idUnique}"></canvas></div></div>`;

            setTimeout(() => {
                const getData = (t) => labelsExibicao.map(m => limparNumero(extrairValor(dadosFiltrados.find(ln => (ln.mes||ln.MES) === m && (normalizar(ln.Indicador||ln.INDICADOR).includes(t) || normalizar(ln.Processo||ln.PROCESSO).includes(t))) || {})));
                new Chart(document.getElementById(idUnique), {
                    type: 'bar',
                    data: {
                        labels: labelsExibicao,
                        datasets: [
                            { label: '3º Turno', data: getData("3º TURNO"), backgroundColor: '#f59e0b', stack: 's1' },
                            { label: '2º Turno', data: getData("2º TURNO"), backgroundColor: '#000000', stack: 's1' },
                            { label: '1º Turno', data: getData("1º TURNO"), backgroundColor: '#0284c7', stack: 's1' }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
                });
            }, 100);
        }

        function criarGraficoPerformance(cfg) { 
            /* Insira aqui sua lógica original completa de criarGraficoPerformance */ 
        }
        function criarGraficoConsolidado(titulo, termo) { 
            /* Insira aqui sua lógica original completa de criarGraficoConsolidado */ 
        }
        function calcularResumo() { 
            /* Insira aqui sua lógica original completa de calcularResumo */ 
        }

        // --- DASHBOARD PRINCIPAL COM TODOS OS INDICADORES ---
        function renderizarDashboard() {
            document.getElementById('container-graficos').innerHTML = "";
            calcularResumo();
            
            // Gráficos Separados MOD e MOI
            renderizarGraficoDesligamentoSeparado("MOD", "DESLIGAMENTOS - MOD");
            renderizarGraficoDesligamentoSeparado("MOI", "DESLIGAMENTOS - MOI");

            // Indicadores originais
            criarGraficoPerformance({ chave: "ABSENTEISMO", titulo: "ABSENTEÍSMO PA - 03", tipo: "MENOR_MELHOR" });
            criarGraficoPerformance({ chave: "> 180", titulo: "TURNOVER PA > 180 DIAS", tipo: "MENOR_MELHOR" });
            criarGraficoPerformance({ chave: "< 180", titulo: "TURNOVER PA < 180 DIAS", tipo: "MENOR_MELHOR" });
            criarGraficoPerformance({ chave: "UNIVERSAL", titulo: "TURNOVER CÁLCULO UNIVERSAL", tipo: "MENOR_MELHOR" });

            const itens = [
                { t: "PEDIDO DE DELIGAMENTO EM 15 DIAS", h: "TURNOVER - PEDIDO DE DESLIGAMENTO EM 15 DIAS" },
                { t: "TURNOVER - PEDIDOS DE DESLIGAMENTO MES", h: "TURNOVER - PEDIDOS DE DESLIGAMENTO MÊS" },
                { t: "SOLICITACAO DE DESLIGAMENTO ATE 15", h: "TURNOVER - SOLICITAÇÃO ATÉ 15 DIAS" },
                { t: "SOLICITACAO DE DESLIGAMENTO 16 A 30", h: "TURNOVER - SOLICITAÇÃO 16 A 30 DIAS" },
                { t: "SOLICITACAO DE DESLIGAMENTO 31 A 90", h: "TURNOVER - SOLICITAÇÃO 31 A 90 DIAS" },
                { t: "SOLICITACAO DE DESLIGAMENTO ACIMA DE 90", h: "TURNOVER - SOLICITAÇÃO ACIMA DE 90 DIAS" }
            ];
            itens.forEach(i => criarGraficoConsolidado(i.h, i.t));

            criarGraficoPerformance({ chave: "HORAS DE TREINAMENTO", titulo: "HORAS DE TREINAMENTO", tipo: "MAIOR_MELHOR" });
            criarGraficoPerformance({ chave: "APROVADOS EM TREINAMENTO", titulo: "APROVADOS EM TREINAMENTO", tipo: "MAIOR_MELHOR" });
        }

        const planilhaDrive = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrXO0btL1oimgW_DDA7OZHFb-eZqkt_x66Z6phMPNtKMlKAKq7IGuDbIisw4TPyK76OZ1sC8YVTux4/pub?output=csv";
        Papa.parse(planilhaDrive, { download: true, header: true, complete: r => { dadosGlobais = r.data; renderizarDashboard(); } });
    </script>
</body>
</html>
