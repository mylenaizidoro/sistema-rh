<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>

<div id="container-graficos"></div>

<script>
    // --- VARIÁVEIS GLOBAIS ---
    let dadosGlobais = [];
    let anoSelecionado = 'TODOS';
    let turnoSelecionado = 'TODOS';
    const labelsTodos = [];
    for(let m=1; m<=12; m++) labelsTodos.push(`${m.toString().padStart(2,'0')}/2025`);
    for(let m=1; m<=12; m++) labelsTodos.push(`${m.toString().padStart(2,'0')}/2026`);

    // --- FUNÇÕES DE APOIO ---
    function limparNumero(v) {
        if (!v || v.toString().trim() === "") return 0;
        let num = v.toString().replace(/\s/g, '').replace(',', '.').replace('%', '');
        return parseFloat(num) || 0;
    }

    function normalizar(txt) {
        if (!txt) return "";
        let textoNormalizado = txt.toString().replace(/°/g, "º");
        return textoNormalizado.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
    }

    function extrairValor(ln) {
        return ln['Valor Real'] || ln['Qtd'] || ln['Quantidade'] || ln['VALOR REAL'] || ln['QTD'] || 0;
    }

    // --- NOVA FUNÇÃO PARA SEPARAR MOD E MOI ---
    function criarGraficoDesligamentoPorTipo(tipo, titulo) {
        const labelsExibicao = anoSelecionado === 'TODOS' ? labelsTodos : labelsTodos.filter(l => l.includes(anoSelecionado));
        const dadosBase = dadosGlobais.filter(ln => {
            const proc = normalizar(ln.Processo || ln.PROCESSO || "");
            const ind = normalizar(ln.Indicador || ln.INDICADOR || "");
            return proc === "DESLIGAMENTO" && (proc.includes(tipo) || ind.includes(tipo));
        });

        if (dadosBase.length === 0) return;

        const dT1 = dadosBase.filter(ln => normalizar(ln.Indicador || ln.INDICADOR || "").includes("1º TURNO"));
        const dT2 = dadosBase.filter(ln => normalizar(ln.Indicador || ln.INDICADOR || "").includes("2º TURNO"));
        const dT3 = dadosBase.filter(ln => normalizar(ln.Indicador || ln.INDICADOR || "").includes("3º TURNO"));

        const idUnique = 'chart-' + tipo + Math.random().toString(36).substr(2, 9);
        document.getElementById('container-graficos').innerHTML += `
            <div class="card">
                <h2>${titulo}</h2>
                <div class="chart-container"><canvas id="${idUnique}"></canvas></div>
            </div>`;

        setTimeout(() => {
            new Chart(document.getElementById(idUnique), {
                type: 'bar',
                data: {
                    labels: labelsExibicao,
                    datasets: [
                        { label: '3º Turno', data: labelsExibicao.map(m => limparNumero(extrairValor(dT3.find(l => (l.mes||l.MES) === m) || {}))), backgroundColor: '#f59e0b', stack: 's1' },
                        { label: '2º Turno', data: labelsExibicao.map(m => limparNumero(extrairValor(dT2.find(l => (l.mes||l.MES) === m) || {}))), backgroundColor: '#000000', stack: 's1' },
                        { label: '1º Turno', data: labelsExibicao.map(m => limparNumero(extrairValor(dT1.find(l => (l.mes||l.MES) === m) || {}))), backgroundColor: '#0284c7', stack: 's1' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }, 150);
    }

    // --- FUNÇÕES DE GRÁFICOS ORIGINAIS ---
    function obterDadosBase(chaveProcesso, aplicarTurno = true) {
        return dadosGlobais.filter(ln => {
            const nomeProc = normalizar(ln.Processo || ln.PROCESSO || "");
            const nomeInd = normalizar(ln.Indicador || ln.INDICADOR || "");
            const matchAno = anoSelecionado === 'TODOS' || (ln.mes || ln.MES || "").includes(anoSelecionado);
            let matchTurno = true;
            if (aplicarTurno && turnoSelecionado !== 'TODOS') {
                matchTurno = nomeInd.includes(normalizar(turnoSelecionado)) || nomeProc.includes(normalizar(turnoSelecionado));
            }
            return (nomeProc.includes(normalizar(chaveProcesso)) || nomeInd.includes(normalizar(chaveProcesso))) && matchAno && matchTurno;
        });
    }

    function definirCorBarra(valor, meta, itemTipo) {
        if (normalizar(turnoSelecionado) === '1º TURNO') return '#0284c7'; 
        if (normalizar(turnoSelecionado) === '3º TURNO') return '#f59e0b'; 
        let atingiu = (itemTipo === "MENOR_MELHOR") ? (valor <= meta) : (valor >= meta);
        return atingiu ? '#10b981' : '#f43f5e';
    }

    function calcularResumo() {
        const getMedia = (chave) => {
            let filtrados = obterDadosBase(chave, true);
            if (!filtrados.length) return "0";
            const soma = filtrados.reduce((acc, curr) => acc + limparNumero(extrairValor(curr)), 0);
            return (soma / filtrados.length).toFixed(1);
        };
        // (Sua lógica de resumo aqui)
    }

    function criarGraficoPerformance(itemConfig) {
        const container = document.getElementById('container-graficos');
        let dados = obterDadosBase(itemConfig.chave, itemConfig.ignorarTurno ? false : true);
        if (dados.length === 0) return;

        const idUnique = Math.random().toString(36).substr(2, 9);
        const labelsExibicao = anoSelecionado === 'TODOS' ? labelsTodos : labelsTodos.filter(l => l.includes(anoSelecionado));

        container.innerHTML += `<div class="card"><h2>${itemConfig.titulo}</h2><div class="chart-container"><canvas id="chart-${idUnique}"></canvas></div></div>`;
        
        setTimeout(() => {
            const dFinal = labelsExibicao.map(mes => {
                const r = dados.find(ln => (ln.mes || ln.MES) === mes);
                return r ? limparNumero(extrairValor(r)) : null;
            });
            new Chart(document.getElementById(`chart-${idUnique}`), {
                type: 'bar',
                data: { labels: labelsExibicao, datasets: [{ label: 'Realizado', data: dFinal }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }, 150);
    }

    // --- DASHBOARD ATUALIZADO ---
    function renderizarDashboard() {
        document.getElementById('container-graficos').innerHTML = "";
        
        // Chamada dos novos gráficos separados
        criarGraficoDesligamentoPorTipo("MOD", "TURNOVER - DESLIGAMENTOS (MOD)");
        criarGraficoDesligamentoPorTipo("MOI", "TURNOVER - DESLIGAMENTOS (MOI)");

        // Demais gráficos (coloque aqui todas as suas chamadas originais)
        criarGraficoPerformance({ chave: "ABSENTEISMO", titulo: "ABSENTEÍSMO PA - 03" });
    }

    // --- CARREGAMENTO ---
    const planilhaDrive = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrXO0btL1oimgW_DDA7OZHFb-eZqkt_x66Z6phMPNtKMlKAKq7IGuDbIisw4TPyK76OZ1sC8YVTux4/pub?output=csv";
    Papa.parse(planilhaDrive + "&t=" + new Date().getTime(), {
        download: true, header: true, skipEmptyLines: true,
        complete: function(r) { dadosGlobais = r.data; renderizarDashboard(); }
    });
</script>
</body>
</html>
